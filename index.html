
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>IP Address Tracker</title>

  <!-- Website favicon -->
  <link rel="icon" type="image/png" href="./images/favicon-32x32.png">

  <!-- External CSS stylesheet -->
  <link rel="stylesheet" href="./styles.css">

  <!-- JavaScript file -->
  <script src="./script.js" defer></script>
</head>

<body>
  <main>
    <!-- Header and search section -->
    <header class="header">
      <h1>IP Address Tracker</h1>

      <form id="search-form">
        <label for="ip-input" class="sr-only">
          Enter an IP address or domain
        </label>

        <input
          type="text"
          id="ip-input"
          placeholder="Search for any IP address or domain"
          autocomplete="off"
          required
        >

        <button type="submit" aria-label="Search IP address">
          <img src="./images/icon-arrow.svg" alt="">
        </button>
      </form>
    </header>

    <!-- IP address information -->
    <section class="info-panel" aria-label="IP address information">

      <div class="info-item">
        <h2>IP Address</h2>
        <p id="ip-address">--</p>
      </div>

      <div class="info-item">
        <h2>Location</h2>
        <p id="location">--</p>
      </div>

      <div class="info-item">
        <h2>Timezone</h2>
        <p id="timezone">--</p>
      </div>

      <div class="info-item">
        <h2>ISP</h2>
        <p id="isp">--</p>
      </div>
    </section>

    <!-- Interactive map -->
    <section id="map" aria-label="IP address location map"></section>
  </main>
</body>
</html>
