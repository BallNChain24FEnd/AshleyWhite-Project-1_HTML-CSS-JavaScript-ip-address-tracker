
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IP Address Tracker</title>

  <!-- Website icon -->
  <link rel="icon" href="./images/favicon-32x32.png">

  <!-- Leaflet CSS -->
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
  crossorigin=""
>
  <!-- Project CSS -->
  <link rel="stylesheet" href="./styles.css">

  <!-- Leaflet JS -->
  <script defer
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>

  <!-- Project JS -->
  <script defer src="./script.js"></script>
</head>

<body>
  <main>
    <!-- Header -->
    <header class="header">
      <h1>IP Address Tracker</h1>

      <!-- Search form -->
      <form id="search-form">
        <label for="ip-input" class="sr-only">
          Enter an IP address or domain
        </label>

        <input
          id="ip-input"
          type="text"
          placeholder="Search for any IP address or domain"
          autocomplete="off"
          required
        >

        <button type="submit" aria-label="Search IP address">
          <img src="./images/icon-arrow.svg" alt="">
        </button>
      </form>
      <p id="error-message" role="alert"></p>
    </header>

    <!-- Information card -->
    <section class="info-panel" aria-label="IP address information">
      <div class="info-item">
        <h2>IP Address</h2>
        <p id="ip-address">--</p>
      </div>

      <div class="info-item">
        <h2>Location</h2>
        <p id="location">--</p>
      </div>

      <div class="info-item">
        <h2>Timezone</h2>
        <p id="timezone">--</p>
      </div>

      <div class="info-item">
        <h2>ISP</h2>
        <p id="isp">--</p>
      </div>
    </section>

    <!-- Interactive map -->
    <section id="map" aria-label="IP location map"></section>
  </main>
</body>
</html>
